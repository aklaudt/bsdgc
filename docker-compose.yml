# Local preview of the site, matching the Ruby version used by the
# GitHub Pages build (.github/workflows/jekyll.yml).
#
#   docker compose up      -> http://localhost:4000 (auto-reloads on save)
#   docker compose down    -> stop it
services:
  jekyll:
    image: ruby:3.1
    working_dir: /site
    command: >
      sh -c "bundle install &&
             bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/site
      - bundle:/usr/local/bundle

volumes:
  bundle:
